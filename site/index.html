<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- first-visit gate: returning visitors skip straight to the site (no flash).
       INTRO_DEV is TEMPORARILY true so refreshing always shows the intro while building.
       BEFORE DEPLOY: set INTRO_DEV = false to restore "first visit only". -->
  <script>(function(){
    var INTRO_DEV = true; /* <-- set to false before launch */
    if (INTRO_DEV) return;
    try{var p=new URLSearchParams(location.search);if(p.get("replay")==="1")return;if(localStorage.getItem("intro-seen")==="1")location.replace("home.html");}catch(e){}
  })();</script>
  <script>(function(){var d=document.documentElement;d.classList.add("js");var t;try{t=localStorage.getItem("site-theme");}catch(e){}if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches)?"dark":"light";d.setAttribute("data-theme",t);})();</script>
  <title>涂喆宸 Zhechen Tu — 进入 / Enter</title>
  <meta name="description" content="涂喆宸 (Zhechen Tu) — AI Application & Agent Engineer. Enter the portfolio." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/intro.css?v=10" />
</head>
<body class="intro-body" data-lang="zh">

  <div class="intro__loader" id="introLoader">
    <div class="intro__bar"><i></i></div>
    <div class="intro__loadlabel">Loading</div>
  </div>

  <div class="intro-topbar">
    <a class="intro-brand" href="home.html" data-intro-exit>Zhechen<b>.</b>Tu</a>
    <div class="intro-right">
      <button class="intro-contact" id="introContact" type="button"><span class="zh">联系</span><span class="en">Contact</span></button>
      <button class="intro-lang" data-lang-toggle aria-label="Switch language"><span class="zh-label on">中</span> / <span class="en-label off">EN</span></button>
      <a class="intro-skip" href="home.html" data-intro-exit><span class="zh">跳过</span><span class="en">Skip</span></a>
    </div>
  </div>

  <!-- scrub stage: scrolling this tall container advances the frames -->
  <div class="intro-scroll" id="introScroll">
    <div class="intro-sticky">
      <canvas class="intro__canvas" id="introCanvas"></canvas>
      <div class="intro__lanyard" id="introLanyard" aria-hidden="true"></div>
      <div class="intro__lines">
        <div class="intro__line">
          <h2><span class="zh">涂喆宸</span><span class="en">Zhechen Tu</span></h2>
          <p><span class="zh">AI 应用 · Agent 工程师</span><span class="en">AI Application · Agent Engineer</span></p>
        </div>
        <div class="intro__line">
          <h2><span class="zh">用评测与指标<br />驱动系统</span><span class="en">Systems driven by<br />evals &amp; metrics</span></h2>
        </div>
        <div class="intro__line">
          <h2><span class="zh">多智能体 · RAG<br />端到端交付</span><span class="en">Multi-agent · RAG<br />shipped end-to-end</span></h2>
        </div>
        <div class="intro__line">
          <h2><span class="zh">这是我的作品集</span><span class="en">This is my portfolio</span></h2>
        </div>
      </div>
      <div class="intro__scrollcue" aria-hidden="true"></div>
    </div>
  </div>

  <!-- portal into the full site -->
  <section class="intro__enter">
    <h2><span class="zh">准备好了吗？</span><span class="en">Ready?</span></h2>
    <p><span class="zh">进入完整的个人作品集。</span><span class="en">Step into the full portfolio.</span></p>
    <a class="intro__enterbtn" href="home.html" data-intro-exit><span class="zh">进入</span><span class="en">Enter</span><span class="arrow">↗</span></a>
  </section>

  <noscript>
    <div style="padding:48px 24px;text-align:center;background:#06070c;color:#fff;">
      <a href="home.html" style="color:#fff;font-weight:600;">进入作品集 / Enter the portfolio →</a>
    </div>
  </noscript>

  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/gsap/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis/lenis.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/intro.js?v=2"></script>
  <script src="js/lanyard.bundle.js?v=20"></script>
  <script>
    (function () { var b = document.getElementById('introContact'); if (b) b.addEventListener('click', function () { window.dispatchEvent(new Event('lanyard:drop')); }); })();
  </script>
</body>
</html>
